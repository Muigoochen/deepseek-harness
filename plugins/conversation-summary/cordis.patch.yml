# The layer this bundle contributes: a single plugin row.
#
# No config here on purpose: the plugin's Config schema already supplies the
# defaults. This machine's budget and trigger choices live in the profile layer
# ($DSH_HOME/profiles/<name>/cordis.patch.yml) as a `- id: conversation-summary`
# entry, which patches this row — note that a patched `config` replaces the whole
# object, so that entry restates every key it wants to keep.
#
# Do NOT write a second `- insert:` for this id there: two inserts of the same id
# are a fatal `duplicate loader entry id` at boot.
- insert:
    - id: conversation-summary
      name: '@dsh-user/conversation-summary'
