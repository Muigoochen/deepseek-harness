# workspace-files - a profile-layer entry for $DSH_HOME/profiles/<name>/cordis.patch.yml.
#
# Do NOT write a second `- insert:` for this id. The row already comes from the
# package's own cordis.patch.yml (a bundle layer), and two inserts of the same id
# are a fatal `duplicate loader entry id` at boot. An entry carrying only `- id:`
# patches the row the bundle inserted.
#
# workspace-files has no config, so the useful override is to turn it off here:
- id: workspace-files
  disabled: true
