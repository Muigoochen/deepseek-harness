[plugin]

name="DSH Echo Bridge"
description="Lets the DSH lsp-echo plugin ask this running Godot editor (or headless engine) to rescan the filesystem, so newly created class_name scripts are registered without restarting the engine. Listens on 127.0.0.1 only; supports the 'ping', 'whoami', 'state', 'rescan' and 'unsaved' commands."
author="dsh"
version="1.0"
script="plugin.gd"
