# 追加到 C:\Users\<you>\.dsh\profiles\web\cordis.patch.yml(profile 自己的层),
# 用来覆盖本包自带的默认值。
#
# 不要再写第二个 `- insert:` —— 行已由包根的 cordis.patch.yml(bundle 层)提供,
# 同 id 插两次是**致命的** `duplicate loader entry id`,profile 会直接起不来。
# 只带 `- id:` 的条目才是"修补 bundle 插入的那一行"的正确写法。
# config 是可选的：省略即用全部默认值；这里列出的字段是 base 层，
# 设置页「复读时」开关选出的 mode 会覆盖它。
- id: repeat-stream-guard
  config:
    minPeriodicChars: 120
    minCopies: 5
    maxPeriod: 64
    mode: stop
    maxContinues: 2
